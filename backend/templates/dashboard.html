<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h2>Smart Campus Dashboard</h2>

    <a href="/mark" class="btn btn-success">Attendance</a>
    <a href="/report" class="btn btn-info">Report</a>

    <hr>

    <input id="msg" class="form-control">
    <button onclick="send()" class="btn btn-primary mt-2">Chat</button>

    <p id="reply"></p>
</div>

<script>
function send(){
 fetch('/chat',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message:document.getElementById('msg').value})
 })
 .then(res=>res.json())
 .then(data=>document.getElementById('reply').innerText=data.reply)
}
</script>

</body>
</html>
