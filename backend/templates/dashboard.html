<!DOCTYPE html>
<html>
<head>
<title>Smart Campus AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center text-primary">Smart Campus AI Dashboard</h2>

    <div class="row mt-4">

        <!-- Attendance -->
        <div class="col-md-4">
            <div class="card shadow p-3">
                <h4>Attendance</h4>
                <a href="/mark" class="btn btn-success">Manual</a>
                <a href="/ai-attendance" class="btn btn-warning mt-2">AI Attendance</a>
            </div>
        </div>

        <!-- Reports -->
        <div class="col-md-4">
            <div class="card shadow p-3">
                <h4>Reports</h4>
                <a href="/report" class="btn btn-info">Generate</a>
                <img src="/static/report.png" class="mt-3 img-fluid">
            </div>
        </div>

        <!-- Chatbot -->
        <div class="col-md-4">
            <div class="card shadow p-3">
                <h4>AI Chatbot</h4>
                <input id="msg" class="form-control" placeholder="Ask something...">
                <button onclick="sendMsg()" class="btn btn-primary mt-2">Send</button>
                <p id="reply" class="mt-2 text-success"></p>
            </div>
        </div>

    </div>

</div>

<script>
function sendMsg(){
 fetch('/chat',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message:document.getElementById('msg').value})
 })
 .then(res=>res.json())
 .then(data=>document.getElementById('reply').innerText=data.reply)
}
</script>

</body>
</html>
