<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center">🎓 Smart Campus Dashboard</h2>

    <div class="row mt-4 text-center">

        <div class="col-md-6">
            <div class="card p-3 shadow">
                <h4>Total Students</h4>
                <h2>{{ total }}</h2>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3 shadow">
                <h4>Average Attendance</h4>
                <h2 id="avgText">{{ avg }}</h2>
            </div>
        </div>

    </div>

    <div class="card mt-4 p-3 shadow">
        <h4 class="text-center">📊 Attendance Graph</h4>
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
// 👇 Jinja value safe तरीके से लो
const avg = Number(document.getElementById("avgText").innerText) || 0;

// Chart
new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
        labels: ['Attendance'],
        datasets: [{
            label: 'Average Attendance',
            data: [avg],
            borderWidth: 2
        }]
    }
});

// AI Chat
function chat(){
 fetch('/chat',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message:"attendance"})
 })
 .then(r=>r.json()).then(d=>alert(d.reply))
}

// Risk
function risk(){
 fetch('/risk',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({attendance:40})
 })
 .then(r=>r.json()).then(d=>alert(d.risk))
}
</script>

</body>
</html>
