<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-4">
<h2>👩‍🎓 Student Dashboard</h2>

<button onclick="attendance()">📊 Attendance</button>
<button onclick="fees()">💰 Fees</button>
<button onclick="chat()">💬 Chat</button>
<button onclick="risk()">⚠️ Risk</button>
<button onclick="notice()">📢 Generate Notice</button>

<br><br>
<a href="/">⬅ Back</a>

</div>

<script>
function attendance(){
 fetch('/student/attendance').then(r=>r.json()).then(d=>alert(d.attendance))
}

function fees(){
 fetch('/student/fees').then(r=>r.json()).then(d=>alert(d.fees))
}

function chat(){
 fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({message:"hello"})})
 .then(r=>r.json()).then(d=>alert(d.reply))
}

function risk(){
 fetch('/risk',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({attendance:40})})
 .then(r=>r.json()).then(d=>alert(d.risk))
}

function notice(){
 fetch('/generate_notice',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({topic:"AI Seminar"})})
 .then(r=>r.json()).then(d=>alert(d.notice))
}
</script>

</body>
</html>
