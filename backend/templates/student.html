<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

<h2>👩‍🎓 Student Dashboard</h2>

<div class="row mt-4">

<div class="col-md-4">
<div class="card p-3">
<h5>📊 Attendance</h5>
<p>View your attendance</p>
<button class="btn btn-success" onclick="checkAttendance()">Check</button>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>⚠️ Risk Status</h5>
<button class="btn btn-warning" onclick="risk()">Check Risk</button>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>🤖 Chatbot</h5>
<button class="btn btn-dark" onclick="chat()">Ask</button>
</div>
</div>

</div>

<br>
<a href="/" class="btn btn-secondary">⬅ Back</a>

</div>

<script>
function chat(){
 fetch('/chat',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message:"hello"})
 })
 .then(res=>res.json())
 .then(data=>alert(data.reply))
}

function risk(){
 fetch('/risk',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({attendance:40})
 })
 .then(res=>res.json())
 .then(data=>alert(data.risk))
}

function checkAttendance(){
 fetch('/attendance')
 .then(res=>res.text())
 .then(data=>alert(data))
}
</script>

</body>
</html>
