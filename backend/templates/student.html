<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{margin:0;font-family:sans-serif;background:#f1f5f9;}
.sidebar{width:250px;height:100vh;background:#0f172a;color:white;position:fixed;padding:20px;}
.sidebar a{display:block;color:white;padding:10px;margin:10px 0;text-decoration:none;border-radius:8px;}
.sidebar a:hover{background:#1e293b;}
.main{margin-left:260px;padding:20px;}
.box{background:white;padding:15px;border-radius:12px;text-align:center;box-shadow:0 5px 10px rgba(0,0,0,0.1);}
</style>
</head>

<body>

<div class="sidebar">
<h3>🎓 Student Panel</h3>

<a href="/student">Dashboard</a>
<a href="/attendance_graph">My Attendance</a>
<a href="/notice">Notices</a>
<a href="/chatbot">AI Chatbot</a>
</div>

<div class="main">

<h2>Welcome Student 👋</h2>

<div class="row mt-4">

<div class="col-md-3">
<div class="box">
<h5>Attendance</h5>
<h2>78%</h2>
</div>
</div>

<div class="col-md-3">
<div class="box">
<h5>Fees Status</h5>
<h2>Pending</h2>
</div>
</div>

<div class="col-md-3">
<div class="box">
<h5>Courses</h5>
<h2>4</h2>
</div>
</div>

<div class="col-md-3">
<div class="box">
<h5>Notices</h5>
<h2>3</h2>
</div>
</div>

</div>

<div class="row mt-4">

<div class="col-md-8">
<div class="box">
<h5>📊 Attendance Graph</h5>
<iframe src="/attendance_graph" width="100%" height="300"></iframe>
</div>
</div>

<div class="col-md-4">
<div class="box">
<h5>📢 Latest Notices</h5>
<p>• New semester started</p>
<p>• AI Workshop coming</p>
<p>• Hackathon soon</p>
</div>
</div>

</div>

</div>

</body>
</html>
