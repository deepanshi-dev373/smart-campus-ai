<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Campus Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: 'Segoe UI', sans-serif;
}

/* LEFT */
.left {
    width: 50%;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

.left img {
    width: 70%;
    border-radius: 15px;
    margin-bottom: 20px;
}

.left h4 {
    text-align: center;
}

/* RIGHT */
.right {
    width: 50%;
    background: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* LOGIN BOX */
.login-box {
    width: 350px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.9);
    box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

/* TITLE FIXED (NO ERROR) */
.login-box h1 {
    font-weight: bold;
    margin-bottom: 20px;
    color: #4facfe;
}

/* INPUT */
.form-control {
    border-radius: 10px;
    padding: 10px;
}

/* BUTTON */
.btn-login {
    width: 100%;
    border-radius: 10px;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    color: white;
    font-weight: bold;
}

.btn-login:hover {
    opacity: 0.9;
}
</style>

</head>

<body>

<!-- LEFT -->
<div class="left">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h4>
Manage your institution easily<br>
and perfectly !!
</h4>

</div>

<!-- RIGHT -->
<div class="right">

<div class="login-box">

<h1>SMART CAMPUS</h1>

<form method="POST">

<input type="text" name="email" class="form-control mb-3" placeholder="Enter Email" required>

<input type="password" name="password" class="form-control mb-3" placeholder="Enter Password" required>

<button class="btn btn-login">Sign In</button>

</form>

</div>

</div>

</body>
</html>
<p class="text-center mt-3">
<a href="/signup">Create new account</a>
</p>
