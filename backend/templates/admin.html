<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-4">

<h2>🛠️ Admin Dashboard</h2>

<div class="row text-center">

<div class="col-md-3">
<div class="card p-3 bg-primary text-white">
<h5>Total Students</h5>
<h3>120</h3>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 bg-success text-white">
<h5>Total Faculty</h5>
<h3>25</h3>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 bg-warning text-dark">
<h5>Complaints</h5>
<h3>5</h3>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 bg-danger text-white">
<h5>Alerts</h5>
<h3>3</h3>
</div>
</div>

</div>

<br>

<div class="card p-3">
<h5>📊 Quick Actions</h5>
<button class="btn btn-primary m-1">Students DB</button>
<button class="btn btn-success m-1">Faculty DB</button>
<button class="btn btn-warning m-1">Timetable</button>
</div>

<br>
<a href="/" class="btn btn-secondary">⬅ Back</a>

</div>

</body>
</html>
