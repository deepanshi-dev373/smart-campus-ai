<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:sans-serif;
            background:#f1f5f9;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:#0f172a;
            color:white;
            position:fixed;
            padding:20px;
        }

        .sidebar h3{
            margin-bottom:30px;
        }

        .sidebar a{
            display:block;
            color:white;
            padding:10px;
            text-decoration:none;
            border-radius:8px;
            margin-bottom:10px;
        }

        .sidebar a:hover{
            background:#1e293b;
        }

        .main{
            margin-left:260px;
            padding:20px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        .top-box{
            background:white;
            padding:15px;
            border-radius:12px;
            text-align:center;
        }

    </style>
</head>

<body>

<div class="sidebar">
    <h3>🎓 Smart Campus</h3>

    <a href="/admin">Dashboard</a>
    <a href="/students">Students</a>
    <a href="/attendance_graph">Attendance</a>
    <a href="/notice">Notice</a>
    <a href="/chatbot">AI Chatbot</a>
</div>

<div class="main">

    <h2>Welcome Dashboard 👋</h2>

    <!-- TOP CARDS -->
    <div class="row mt-4">

        <div class="col-md-3">
            <div class="top-box">
                <h5>Total Students</h5>
                <h2>{{ students }}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="top-box">
                <h5>Total Teachers</h5>
                <h2>{{ teachers }}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="top-box">
                <h5>Attendance</h5>
                <h2>{{ attendance }}%</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="top-box">
                <h5>Fees Pending</h5>
                <h2>{{ fees }}</h2>
            </div>
        </div>

    </div>

    <!-- GRAPH + NOTICE -->
    <div class="row mt-4">

        <div class="col-md-8">
            <div class="card p-3">
                <h5>📊 Attendance Overview</h5>
                <iframe src="/attendance_graph" width="100%" height="300"></iframe>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
                <h5>📢 Latest Notices</h5>

                {% for n in notices %}
                    <p>• {{ n[0] }}</p>
                {% endfor %}

            </div>
        </div>

    </div>

</div>

</body>
</html>
