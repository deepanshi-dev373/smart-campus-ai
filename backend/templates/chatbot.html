<!DOCTYPE html>
<html>
<head>
    <title>Smart AI Chatbot</title>

    <style>
        body{
            margin:0;
            font-family:sans-serif;
            background:#0f172a;
            color:white;
        }

        .chat-container{
            height:100vh;
            display:flex;
            flex-direction:column;
        }

        .header{
            padding:15px;
            background:#1e293b;
            font-weight:bold;
        }

        .messages{
            flex:1;
            overflow-y:auto;
            padding:15px;
        }

        .msg{
            max-width:70%;
            padding:10px;
            border-radius:10px;
            margin:8px 0;
        }

        .user{
            background:#3b82f6;
            margin-left:auto;
        }

        .bot{
            background:#1e293b;
        }

        .input-box{
            display:flex;
            padding:10px;
            background:#1e293b;
        }

        input{
            flex:1;
            padding:10px;
            border:none;
            border-radius:10px;
        }

        button{
            margin-left:8px;
            padding:10px;
            border:none;
            border-radius:10px;
            background:#22c55e;
            color:white;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">🤖 Smart Campus AI (Online)</div>

    <div class="messages" id="chatBox">
        <div class="msg bot">Hello 👋 I am your AI Assistant</div>
    </div>

    <div class="input-box">
        <input id="msg" placeholder="Type message...">
        <button onclick="sendMsg()">Send</button>
        <button onclick="startVoice()">🎤</button>
    </div>

</div>

<script>

function sendMsg(){
    let msg = document.getElementById("msg").value;
    if(msg=="") return;

    let box = document.getElementById("chatBox");

    box.innerHTML += `<div class="msg user">${msg}</div>`;

    fetch("/ask",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"msg="+msg
    })
    .then(res=>res.text())
    .then(data=>{
        box.innerHTML += `<div class="msg bot">${data}</div>`;
        box.scrollTop = box.scrollHeight;
    });

    document.getElementById("msg").value="";
}

// 🎤 VOICE INPUT
function startVoice(){
    let recognition = new webkitSpeechRecognition();
    recognition.lang="en-IN";

    recognition.onresult=function(e){
        document.getElementById("msg").value = e.results[0][0].transcript;
        sendMsg();
    }

    recognition.start();
}

</script>

</body>
</html>
