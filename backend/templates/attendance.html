<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-4">

  <h2>📊 Attendance Dashboard</h2>

  <!-- TABLE -->
  <table class="table table-bordered mt-3">
    <tr>
      <th>Name</th>
      <th>Attendance %</th>
      <th>Action</th>
    </tr>

    {% for s in students %}
    <tr>
      <td>{{ s.name }}</td>
      <td>{{ s.percent }}%</td>
      <td>
        <form method="post" action="/mark/{{ s.id }}">
          <button class="btn btn-success btn-sm">Mark Present</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>

  <!-- GRAPH -->
  <div class="mt-5">
    <h4>📈 Analytics</h4>
    <canvas id="chart"></canvas>
  </div>

  <!-- DEFAULTERS -->
  <div class="mt-5">
    <h4>⚠ Defaulter List (Below 75%)</h4>

    <ul class="list-group">
      {% for d in defaulters %}
        <li class="list-group-item text-danger">
          {{ d.name }} - {{ d.percent }}%
        </li>
      {% endfor %}
    </ul>
  </div>

</div>

<script>
const ctx = document.getElementById('chart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: {{ students | map(attribute='name') | list | safe }},
        datasets: [{
            label: 'Attendance %',
            data: {{ students | map(attribute='percent') | list | safe }},
        }]
    }
});
</script>

</body>
</html>
