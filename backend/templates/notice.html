<!DOCTYPE html>
<html>
<head>
<title>Notice</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

<h2>📢 Notice Board</h2>

<form method="POST" action="/add_notice" class="mt-3">
<input type="text" name="title" class="form-control mb-2" placeholder="Title" required>
<textarea name="content" class="form-control mb-2" placeholder="Content"></textarea>
<button class="btn btn-primary">Add Notice</button>
</form>

<ul class="list-group mt-4">
{% for n in data %}
<li class="list-group-item">
<b>{{ n[1] }}</b><br>
{{ n[2] }}
</li>
{% endfor %}
</ul>

<a href="/admin" class="btn btn-secondary mt-3">⬅ Back</a>

</div>
</body>
</html>
