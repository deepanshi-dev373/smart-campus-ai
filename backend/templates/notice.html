<!DOCTYPE html>
<html>
<head>
    <title>Notice Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#1e3c72,#2a5298);
            color:white;
            font-family: 'Segoe UI', sans-serif;
        }

        .section{
            background: rgba(255,255,255,0.1);
            padding:20px;
            border-radius:15px;
            margin-bottom:20px;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            font-weight:bold;
        }

        .card{
            background:white;
            color:black;
            border-radius:12px;
            padding:15px;
            margin-bottom:10px;
        }

        .form-box{
            background:white;
            color:black;
            padding:20px;
            border-radius:15px;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <!-- ================= CAMPUS NEWS ================= -->
    <div class="section">
        <h2>📢 Campus News</h2>

        <div class="card">New semester starts from next week 📅</div>
        <div class="card">AI Workshop organized in campus 🤖</div>
        <div class="card">Placement drive by top companies 💼</div>
    </div>

    <!-- ================= EVENTS ================= -->
    <div class="section">
        <h2>🎉 Events</h2>

        <div class="card">Hackathon 2026 🚀</div>
        <div class="card">Cultural Fest 🎭</div>
        <div class="card">Tech Seminar by Experts 🎤</div>
    </div>

    <!-- ================= NOTICE BOARD ================= -->
    <div class="section">
        <h2>📌 Notice Board</h2>

        {% for n in data %}
            <div class="card">
                <h5>{{ n[1] }}</h5>
                <p>{{ n[2] }}</p>
            </div>
        {% endfor %}
    </div>

    <!-- ================= ADD NOTICE ================= -->
    <div class="form-box mt-4">
        <h4>Add New Notice</h4>

        <form method="POST" action="/add_notice">
            <input class="form-control mb-2" type="text" name="title" placeholder="Enter Title" required>
            <textarea class="form-control mb-2" name="content" placeholder="Enter Content" required></textarea>

            <button class="btn btn-primary w-100">Add Notice</button>
        </form>
    </div>

</div>

</body>
</html>
