<!DOCTYPE html>
<html>
<head>
<title>Students</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>🎓 Student Management</h2>

<form method="POST" action="/add_student" class="row g-2 mb-4">

<div class="col-md-3">
<input name="name" class="form-control" placeholder="Name" required>
</div>

<div class="col-md-3">
<input name="course" class="form-control" placeholder="Course" required>
</div>

<div class="col-md-3">
<input name="semester" class="form-control" placeholder="Semester" required>
</div>

<div class="col-md-3">
<button class="btn btn-primary w-100">Add Student</button>
</div>

</form>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>Name</th>
<th>Course</th>
<th>Semester</th>
<th>Attendance</th>
<th>Action</th>
</tr>

{% for s in data %}
<tr>
<td>{{ s[0] }}</td>
<td>{{ s[1] }}</td>
<td>{{ s[2] }}</td>
<td>{{ s[3] }}</td>
<td>{{ s[4] }}</td>
<td>
<a href="/delete_student/{{ s[0] }}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
{% endfor %}

</table>

</body>
</html>
